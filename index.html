<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoopsMatic Admin — NBA Data HQ</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b1a;--panel:#14142b;--panel2:#1b1b36;--line:#2a2a4d;--tx:#e8e8f4;--dim:#8a8ab0;--gold:#ffd24d;--acc:#ff5a36;--green:#34d97a;--red:#ff6b6b;--amber:#e0b14f;--blue:#5b9ee0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:13px;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:'Oswald',sans-serif;font-size:24px;letter-spacing:2px;text-transform:uppercase}
h1 b{color:var(--gold)}
.sub{color:var(--dim);margin:4px 0 16px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.card h2 .ok{color:var(--green)} .card h2 .bad{color:var(--red)} .card h2 .unk{color:var(--dim)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:3px 0;color:var(--dim)}
.kv b{color:var(--tx);font-weight:600;text-align:right}
.card a{color:var(--blue);text-decoration:none;font-size:11px;margin-right:10px}
.card a:hover{color:var(--gold)}
.links{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.feedhd{font-family:'Oswald',sans-serif;font-size:16px;letter-spacing:1.5px;text-transform:uppercase;margin:18px 0 10px}
.dayhd{color:var(--dim);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.tag{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;letter-spacing:1px;border:1px solid;border-radius:4px;padding:2px 7px;white-space:nowrap;margin-top:1px}
.tag.game{color:var(--gold);border-color:var(--gold)}
.tag.inj-added{color:var(--red);border-color:var(--red)}
.tag.inj-cleared{color:var(--green);border-color:var(--green)}
.tag.inj-status{color:var(--amber);border-color:var(--amber)}
.tag.inj-reason{color:var(--dim);border-color:var(--dim)}
.tag.milestone{color:var(--blue);border-color:var(--blue)}
/* NOT .tag.tx -- ".tx" is already the feed's detail container (.ev .tx has
   flex:1), so a tag with that class stretched across the whole row. */
.tag.trx{color:var(--green);border-color:var(--green)}
.tag.roster{color:var(--tx);border-color:var(--dim)}
.tag.doc{color:#b98aff;border-color:#b98aff}
.tag.sheet{color:#3ad6c6;border-color:#3ad6c6}
.tag.gleague{color:#ff8a5c;border-color:#ff8a5c}
.tag.wiki{color:#7fd3ff;border-color:#7fd3ff}
.slate{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.sg{min-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:0 0 auto}
.sg .mu{font-family:'Oswald',sans-serif;font-size:15px}
.sg .mu b{color:var(--gold)}
.sg .st{color:var(--dim);font-size:11px;margin:2px 0 6px}
.sg .st.live{color:var(--green)}
.sg .inj{font-size:10.5px;color:var(--dim);line-height:1.5}
.sg .inj .o{color:var(--red)} .sg .inj .q{color:var(--amber)}
.watch{margin-top:8px;border-top:1px solid var(--line);padding-top:7px;font-size:11px;color:var(--dim);line-height:1.6}
.watch b{color:var(--tx)}
.ev .tx{flex:1;line-height:1.45}
.ev .tx b{color:var(--gold)}
.ev .tm{color:var(--dim);font-size:10px;white-space:nowrap;margin-top:2px}
.statuschips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 10px;font-size:11px;color:var(--dim)}
.chip b{color:var(--tx)}
.empty{padding:24px;text-align:center;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:10px}
.note{color:var(--dim);font-size:11px;margin-top:26px}
.note b{color:var(--gold)}
.ctrl{display:flex;gap:10px;align-items:center;margin:0 0 16px}
.btn{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;background:var(--gold);color:#1a1400;border:none;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.btn.ghost.has{color:var(--green);border-color:var(--green)}
.dmsg{color:var(--dim);font-size:11px}
.card .runlink{color:var(--gold);cursor:pointer}

/* ===== COLLAPSE ===== */
.card h2 .ctog{cursor:pointer;user-select:none}
.card h2 .ctog:hover{opacity:.75}
.card .mini{display:none;color:var(--dim);font-size:12px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.collapsed .cbody{display:none}
.card.collapsed .mini{display:block;margin-top:2px}

/* Condensed: all four on one row. auto-fit rather than a fixed count, so it
   stays right if a fifth source is added or the window is narrow. */
body.condensed #statusGrid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:8px}
body.condensed .card{padding:9px 11px}
body.condensed .card h2{font-size:12px;margin:0;letter-spacing:.04em}
body.condensed .card .cbody{display:none}
body.condensed .card .mini{display:block;margin-top:3px}
@media(max-width:640px){
  body.condensed #statusGrid{grid-template-columns:1fr 1fr}
}

/* ===== EVENT LOG PANEL =====
   These ten classes were referenced by the JS and the markup but never
   existed in the stylesheet, so `display:flex` dropped the panel into the
   normal page flow as unstyled text -- the whole feature was wired up and
   invisible. */
.log-panel{position:fixed;right:16px;bottom:16px;z-index:60;
  width:min(430px,calc(100vw - 32px));max-height:min(70vh,620px);
  display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.55)}
.log-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:11px 13px;border-bottom:1px solid var(--line);
  font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--gold);flex:none}
.log-x{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:4px 9px;margin-left:5px;cursor:pointer}
.log-x:hover{color:var(--tx);border-color:var(--dim)}
.log-body{flex:1;overflow-y:auto;padding:6px 4px 8px}
.log-item{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;
  border-bottom:1px solid rgba(42,42,77,.5)}
.log-item:last-child{border-bottom:none}
.log-item:hover{background:var(--panel2)}
/* the tag reuses the feed's colour language so the same event reads the
   same way in both places */
.lt{font-family:'Oswald',sans-serif;font-size:9px;font-weight:700;
  letter-spacing:1px;border:1px solid var(--line);border-radius:4px;
  padding:2px 6px;color:var(--dim);white-space:nowrap;flex:none;margin-top:1px}
.lt.game{color:var(--gold);border-color:var(--gold)}
.lt.milestone{color:var(--blue);border-color:var(--blue)}
.lt.injury{color:var(--red);border-color:var(--red)}
.lt.trx{color:var(--green);border-color:var(--green)}
.lt.roster{color:var(--tx);border-color:var(--dim)}
.lt.doc{color:#b98aff;border-color:#b98aff}
.lt.sheet{color:#3ad6c6;border-color:#3ad6c6}
.lt.gleague{color:#ff8a5c;border-color:#ff8a5c}
.lt.wiki{color:#7fd3ff;border-color:#7fd3ff}
.lx{flex:1;line-height:1.45;font-size:12px;word-break:break-word}
.ld{color:var(--dim);font-size:10px;margin-top:3px}
.log-empty{padding:26px 18px;text-align:center;color:var(--dim);
  font-size:12px;line-height:1.6}
/* unread count on the bell */
.unread{display:inline-block;min-width:17px;padding:1px 5px;margin-left:4px;
  border-radius:99px;background:var(--acc);color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;
  text-align:center;vertical-align:1px}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .log-panel{left:8px;right:8px;bottom:8px;width:auto;max-height:78vh}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>HoopsMatic <b>Admin</b></h1>
  <div class="sub" id="topline">NBA Data HQ — pipelines, updates and feeds in one place · loading…</div>
  <div class="ctrl">
    <button class="btn" id="updateAll">⟳ Update all</button>
    <button class="btn ghost" id="tokenBtn">token</button>
    <button class="btn ghost" id="bellBtn">🔔 alerts</button>
    <button class="btn ghost" id="condenseBtn">▤ condense</button>
    <button class="btn ghost" id="logBtn">📋 log</button>
    <span id="dispatchMsg" class="dmsg"></span>
  </div>

  <div class="grid" id="statusGrid"></div>

  <div id="logPanel" class="log-panel" style="display:none">
    <div class="log-head">
      <span>Event log</span>
      <span>
        <button class="log-x" id="logMarkRead">mark read</button>
        <button class="log-x" id="logClear">clear</button>
        <button class="log-x" id="logClose">✕</button>
      </span>
    </div>
    <div id="logBody" class="log-body"></div>
  </div>

  <div id="slateWrap" style="display:none">
    <div class="feedhd">Tonight's slate</div>
    <div class="slate" id="slate"></div>
  </div>

  <div class="feedhd">Latest activity</div>
  <div id="feed"><div class="empty">Loading feeds…</div></div>

  <div class="note" id="buildNote"></div>
</div>

<script>
"use strict";
const ADMIN_BUILD="admin v5.5 · Wikipedia card · 2026-08-06";
console.log("[ADMIN]",ADMIN_BUILD);

/* ============================================================
   SOURCES REGISTRY — add future projects here.
   Each source: repo info (for health), plus an optional loader
   that contributes events to the unified feed and lines to its
   status card. Set `owner` per source if repos live on
   different accounts.
   ============================================================ */
const DEFAULT_OWNER="aderoa";
const SOURCES=[
  {
    id:"boxscores", label:"Box Scores DB", owner:DEFAULT_OWNER, repo:"nba-boxscores",
    workflow:"Daily box score update", workflowFile:"daily.yml",
    page:o=>`https://${o}.github.io/nba-boxscores/`,
    loader:loadBoxscores,
  },
  {
    id:"injuries", label:"Injury Pulse", owner:DEFAULT_OWNER, repo:"nba-injury-pulse",
    workflow:"Poll NBA injury report", workflowFile:"poll.yml",
    page:o=>`https://${o}.github.io/nba-injury-pulse/`,
    loader:loadInjuries,
  },
  {
    // Label is deliberately season-neutral. The repo publishes ONE file,
    // data/leaderboards_live.json, and its contents switch from playoff to
    // regular season when the season does -- so hardcoding "Playoff" here
    // means editing this file every October and April. The loader reads the
    // scope out of the data instead and says which it found.
    id:"milestones", label:"Milestones", owner:DEFAULT_OWNER, repo:"nba-milestones",
    workflow:"Build leaderboards", workflowFile:"build.yml",
    page:o=>`https://${o}.github.io/nba-milestones/`,
    loader:loadMilestones,
  },
  {
    // The tracker suite (players table, NBA + G League transactions, Google
    // Docs, Google Sheets). It runs locally on Task Scheduler, but publishes
    // to GitHub via nba_push_github.py -- so this reads it exactly like every
    // other source and works from any machine. No workflowFile: the runs
    // happen on that PC, so there is nothing here to dispatch.
    id:"trackers", label:"Change Trackers", owner:DEFAULT_OWNER, repo:"nba-admin",
    page:o=>`https://github.com/${o}/nba-admin/blob/main/data/events.json`,
    loader:loadTrackers,
  },
  {
    // Wikipedia gets its own card because it answers a different question
    // from the other five: those watch NBA sources for roster moves, this
    // watches the whole basketball world for a player's club changing --
    // including leagues nothing else here covers. Same JSON, different slice.
    id:"wiki", label:"Wikipedia", owner:DEFAULT_OWNER, repo:"nba-admin",
    page:o=>`https://github.com/${o}/nba-admin/blob/main/nba_wiki_snapshots/wiki_log.csv`,
    loader:loadWiki,
  },
  // future: {id:"draft", label:"Draft Tracker", repo:"nba-draft-tracker", loader:loadDraft, ...}
];

const state={events:[],cards:{},health:{},teamNames:null};
const $=s=>document.getElementById(s);
const esc=x=>{const d=document.createElement("div");d.textContent=String(x==null?"":x);return d.innerHTML};
function eid(ev){ // stable id for de-dup across refreshes
  const base=(ev.kind||"")+"|"+(ev.ts||"")+"|"+(ev.id||ev.html||ev.tag||"");
  let h=0; for(let i=0;i<base.length;i++){h=((h<<5)-h+base.charCodeAt(i))|0;}
  return (ev.kind||"e")+"_"+(h>>>0).toString(36);
}
const raw=(o,r,p)=>`https://raw.githubusercontent.com/${o}/${r}/main/${p}`;
function ago(iso){
  if(!iso)return "—";
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90)return Math.round(s)+"s ago";
  if(s<5400)return Math.round(s/60)+"m ago";
  if(s<129600)return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}
function currentSy(){const n=new Date();return n.getMonth()>=8?n.getFullYear()+1:n.getFullYear()}

/* ---------------- box scores source ---------------- */
async function tailNDJSON(url,bytes){
  try{
    const r=await fetch(url,{headers:{"Range":`bytes=-${bytes}`},cache:"no-cache"});
    if(r.status===206){
      const t=await r.text();
      const lines=t.split("\n");lines.shift();           // drop partial first line
      return lines.map(l=>l.trim()).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
    }
  }catch(e){}
  const r=await fetch(url,{cache:"no-cache"});           // fallback: full file
  if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();
  return t.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{try{return JSON.parse(l)}catch(e){return null}}).filter(Boolean);
}
function teamLabel(tri,sy){
  if(state.teamNames){
    for(const r of state.teamNames){
      if(r.nba===tri&&(r.minSy==null||sy>=r.minSy)&&(r.maxSy==null||sy<=r.maxSy))return r.name;
    }
  }
  return tri;
}
function gameTypeTag(gid){
  const c=String(gid||"")[2];
  return c==="4"?" · Playoffs":c==="5"?" · Play-In":"";
}
async function loadBoxscores(src){
  const sy=currentSy();
  // team names (once)
  if(state.teamNames===null){
    try{const r=await fetch(raw(src.owner,src.repo,"data/team_codes.json"),{cache:"no-cache"});
        state.teamNames=r.ok?(await r.json()).rules:false;}catch(e){state.teamNames=false}
  }
  let st={};
  try{st=await (await fetch(raw(src.owner,src.repo,"state.json"),{cache:"no-cache"})).json()}catch(e){}
  const games=await tailNDJSON(raw(src.owner,src.repo,`data/${sy}/games.ndjson`),120000);
  const recent=games.slice(-40);
  const days=new Set(recent.map(g=>g.date));
  const lastDays=[...days].sort().slice(-4);             // last 4 game dates in tail
  let count=0;
  for(const g of recent){
    if(!lastDays.includes(g.date))continue;
    state.events.push({
      day:g.date, ts:g.date+"T23:59:59Z", kind:"game",
      html:`<b>${esc(teamLabel(g.away,sy))} ${g.awayScore??"—"}</b> @ <b>${esc(teamLabel(g.home,sy))} ${g.homeScore??"—"}</b>${gameTypeTag(g.gameId)}`
    });
    count++;
  }
  let qrow=["Data quality","—"], qchips=[], qstatus=null;
  try{
    const qr=await fetch(raw(src.owner,src.repo,"data/quality_report.json"),{cache:"no-cache"});
    if(qr.ok){
      const q=await qr.json();
      qstatus=q.status;
      qrow=["Data quality",q.status.toUpperCase()+" · "+ago(q.generated_at_utc)];
      qchips=(q.checks||[]).filter(c=>c.status==="warn"||c.status==="fail")
        .map(c=>`${esc(c.label)}: <b>${esc(c.status)}</b>`);
    }
  }catch(e){}
  if(qstatus==="fail")notifyOnce("quality-fail","Box scores DB: data quality FAIL");
  state.cards[src.id]={
    rows:[["Season",`${sy-1}-${String(sy).slice(-2)}`],
          ["Processed through",st.last_processed_date||"—"],
          ["Games in tail",String(count)],qrow],
    chips:qchips,
  };
}

/* ---------------- injuries source ---------------- */
const INJ_TAG={added:"inj-added",cleared:"inj-cleared",status_change:"inj-status",reason_change:"inj-reason"};
const INJ_LABEL={added:"INJ +",cleared:"INJ ✓",status_change:"INJ ~",reason_change:"INJ ·"};
function injText(c){
  if(c.type==="added")return `<b>${esc(c.player)}</b> (${esc(c.team_abbr)}) listed <b>${esc(c.status)}</b>${c.reason?` — ${esc(c.reason)}`:""}`;
  if(c.type==="cleared")return `<b>${esc(c.player)}</b> (${esc(c.team_abbr)}) cleared (was ${esc(c.previous_status||"?")})`;
  if(c.type==="status_change")return `<b>${esc(c.player)}</b> (${esc(c.team_abbr)}): ${esc(c.from_status)} → <b>${esc(c.to_status)}</b>`;
  if(c.type==="reason_change")return `<b>${esc(c.player)}</b> (${esc(c.team_abbr)}, ${esc(c.status)}): reason updated`;
  return esc(JSON.stringify(c));
}
async function loadInjuries(src){
  const r=await fetch(raw(src.owner,src.repo,"data/injury_pulse_live.json"),{cache:"no-cache"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const counts={Out:0,Doubtful:0,Questionable:0,Probable:0,Available:0};
  let nys=0;
  state.injByTeam={};
  (j.teams||[]).forEach(t=>{
    if(t.not_yet_submitted)nys++;
    const e={out:[],q:[]};
    (t.players||[]).forEach(p=>{
      if(p.status in counts)counts[p.status]++;
      if(p.status==="Out")e.out.push(p.name);
      else if(p.status==="Questionable"||p.status==="Doubtful")e.q.push(p.name);
    });
    state.injByTeam[t.team_abbr]=e;
  });
  (j.recent_changes||[]).slice(0,60).forEach(c=>{
    state.events.push({day:c.ts.slice(0,10),ts:c.ts,kind:INJ_TAG[c.type]||"inj-reason",
                       tag:INJ_LABEL[c.type]||"INJ",html:injText(c)});
  });
  state.cards[src.id]={
    rows:[["Report",j.report_ts||"—"],["Last poll",ago(j.polled_at_utc)],
          ["Pending teams",String(nys)]],
    chips:Object.entries(counts).filter(([,v])=>v>0).map(([k,v])=>`${k} <b>${v}</b>`),
  };
}

/* ---------------- failure alerts ---------------- */
const BELL_KEY="hoopsmatic_admin_alerts";
const LOG_KEY="hoopsmatic_admin_eventlog";
const SEEN_KEY="hoopsmatic_admin_seen";
const UNREAD_KEY="hoopsmatic_admin_unread";
let eventLog=[]; let seenIds=new Set(); let firstSync=true;
function loadLog(){
  try{ eventLog=JSON.parse(localStorage.getItem(LOG_KEY)||"[]"); }catch(e){ eventLog=[]; }
  try{ seenIds=new Set(JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")); }catch(e){ seenIds=new Set(); }
  // if we already have a seen-set from a prior session, this isn't a first sync
  firstSync = seenIds.size===0;
}
function saveLog(){
  try{
    localStorage.setItem(LOG_KEY, JSON.stringify(eventLog.slice(0,500)));
    localStorage.setItem(SEEN_KEY, JSON.stringify([...seenIds].slice(-2000)));
  }catch(e){}
}
function unreadCount(){ return +(localStorage.getItem(UNREAD_KEY)||"0"); }
function setUnread(n){ localStorage.setItem(UNREAD_KEY, String(Math.max(0,n))); renderBell(); }

const notified=new Set();
function alertsOn(){return localStorage.getItem(BELL_KEY)==="1"&&("Notification" in window)&&Notification.permission==="granted"}
async function toggleAlerts(){
  if(!("Notification" in window))return alert("This browser doesn't support notifications.");
  if(alertsOn()){localStorage.setItem(BELL_KEY,"0")}
  else{
    const p=await Notification.requestPermission();
    if(p==="granted")localStorage.setItem(BELL_KEY,"1");
  }
  renderBell();
}
function renderBell(){
  const b=$("bellBtn");
  const u=unreadCount();
  b.classList.toggle("has",alertsOn());
  b.innerHTML=(alertsOn()?"🔔 alerts ✓":"🔔 alerts")+(u>0?' <span class="unread">'+(u>99?"99+":u)+'</span>':"");
}
function notifyOnce(key,msg){
  if(!alertsOn()||notified.has(key))return;
  notified.add(key);
  try{new Notification("HoopsMatic Admin",{body:msg})}catch(e){}
}

/* ---------------- tonight's slate (cdn scoreboard, client-side) ---------------- */
async function loadSlate(){
  try{
    const r=await fetch("https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json",{cache:"no-cache"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const games=((await r.json()).scoreboard||{}).games||[];
    if(!games.length){$("slateWrap").style.display="none";return}
    const inj=t=>{
      const e=(state.injByTeam||{})[t];if(!e)return "";
      const o=e.out.slice(0,2).map(n=>`<span class="o">${esc(n)} OUT</span>`);
      const q=e.q.slice(0,2).map(n=>`<span class="q">${esc(n)} ?</span>`);
      const more=(e.out.length>2?e.out.length-2:0)+(e.q.length>2?e.q.length-2:0);
      const bits=[...o,...q];if(more)bits.push(`+${more}`);
      return bits.length?`<div>${t}: ${bits.join(" · ")}</div>`:"";
    };
    $("slate").innerHTML=games.map(g=>{
      const a=g.awayTeam||{},h=g.homeTeam||{};
      const live=g.gameStatus===2, fin=g.gameStatus===3;
      const score=g.gameStatus!==1?` <b>${a.score??""}–${h.score??""}</b>`:"";
      const st=(g.gameStatusText||"").trim();
      return `<div class="sg">
        <div class="mu">${esc(a.teamTricode)} @ ${esc(h.teamTricode)}${score}</div>
        <div class="st ${live?"live":""}">${live?"🔴 ":""}${esc(st)}${fin?"":""}</div>
        <div class="inj">${inj(a.teamTricode)}${inj(h.teamTricode)}</div>
      </div>`;
    }).join("");
    $("slateWrap").style.display="";
  }catch(e){console.warn("slate unavailable:",e);$("slateWrap").style.display="none"}
}

/* ---------------- playoff milestones source ---------------- */
/* Which season is this file describing?

   There is no season_type field, and only one file -- so it is read out of the
   milestone text, which says "all-time playoff scoring list" during the
   postseason and drops the word the rest of the year. Sampling several lines
   rather than one, because a single milestone could word it either way.

   Returns "" when there is nothing to judge by; the card then just says
   Milestones and claims nothing it cannot support. */
function milestoneScope(j){
  const txt=(j.recent_milestones||[]).slice(0,25).map(m=>String(m.text||"")).join(" ").toLowerCase();
  if(!txt) return "";
  const po=(txt.match(/playoff/g)||[]).length;
  return po>=3?"Playoffs":"Regular season";
}

async function loadMilestones(src){
  const r=await fetch(raw(src.owner,src.repo,"data/leaderboards_live.json"),{cache:"no-cache"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();
  const scope=milestoneScope(j);
  const liveGames=(j.active_games||[]).filter(g=>g.in_progress);
  const pts=(j.stats&&j.stats.PTS&&j.stats.PTS.rows)||[];
  const leader=pts[0]?`${pts[0].name} (${pts[0].total.toLocaleString()})`:"—";
  const movers=pts.filter(x=>x.live&&x.delta>0).slice(0,4);
  (j.recent_milestones||[]).slice(0,40).forEach(m=>{
    state.events.push({day:m.ts.slice(0,10),ts:m.ts,kind:"milestone",
                       tag:scope==="Playoffs"?"PLAYOFF":"MILESTONE",html:esc(m.text)});
  });
  const watch=(j.watch_list||[]).slice(0,5);
  state.cards[src.id]={
    // "Playoffs Milestones" reads wrong; the adjective differs from the noun.
    label:scope==="Playoffs"?"Playoff Milestones"
         :scope==="Regular season"?"Regular Season Milestones":"Milestones",
    rows:[["Scope",scope||"unknown"],
          ["Last poll",ago(j.last_polled_utc)],
          ["Live games",String(liveGames.length)],
          ["PTS leader",leader]],
    mini:leader,
    chips:movers.map(x=>`${esc(x.name)} <b>+${x.delta}</b>`),
    extra:watch.length?`<div class="watch"><b>Watch:</b> ${watch.map(w=>esc(w.text)).join("<br>")}</div>`:"",
  };
}

/* ---------------- change trackers ----------------
   data/events.json in the nba-admin repo, written by nba_push_github.py on the
   machine that runs the trackers. Reading it from `raw` rather than from
   http://localhost:8765 is what makes this work anywhere -- an https dashboard
   cannot fetch a localhost URL at all, browsers block it as mixed content.

   The trade is latency: raw.githubusercontent sits behind a CDN with roughly a
   five-minute cache, so a change can take that long to appear here even though
   the push happened immediately. The card shows both the push time and the
   build time so the two are never confused with each other. */
const TRK_KIND={PLAYERS:"roster",TRANSACTIONS:"trx",DOCS:"doc",
                SHEETS:"sheet",GLEAGUE:"gleague",WIKI:"wiki"};
const TRK_TAG={PLAYERS:"ROSTER",TRANSACTIONS:"TRANSACTION",DOCS:"DOC",
               SHEETS:"SHEET",GLEAGUE:"G LEAGUE",WIKI:"WIKIPEDIA"};

async function loadTrackers(src){
  const r=await fetch(raw(src.owner,src.repo,"data/events.json"),{cache:"no-cache"});
  if(!r.ok){
    // 404 means the pusher has never run. That is a different problem from a
    // broken feed and the card should say which.
    if(r.status===404){
      state.cards[src.id]={rows:[["Status","never published"],
        ["Fix","run nba_push_github.py on the tracker machine"]],chips:[]};
      return;
    }
    throw new Error("HTTP "+r.status);
  }
  const j=await r.json();
  (j.events||[]).forEach(e=>{
    const kind=TRK_KIND[e.source]||"trx";
    state.events.push({
      day:(e.detected_at||"").slice(0,10), ts:e.detected_at, kind,
      tag:TRK_TAG[e.source]||e.source, html:esc(e.detail),
      id:e.source+"|"+e.detected_at+"|"+e.detail,   // stable across refreshes
    });
  });
  // WIKI has its own card; leave it out of this one's chips so the two do
  // not report the same number twice.
  const feeds={};
  Object.keys(j.feeds||{}).forEach(k=>{ if(k!=="WIKI") feeds[k]=j.feeds[k]; });
  // A feed with no events at all is a different problem from a quiet one, and
  // only the newest timestamp distinguishes them.
  const chips=Object.keys(TRK_TAG).filter(k=>feeds[k]).map(k=>
    `${esc(TRK_TAG[k])} <b>${feeds[k].count}</b>`);
  const local=Object.values(feeds).reduce((a,f)=>a+(f.count||0),0);
  const silent=Object.keys(TRK_TAG).filter(k=>k!=="WIKI"&&!feeds[k]);
  const newest=Object.values(feeds).map(f=>f.last).sort().pop()||"";
  state.cards[src.id]={
    // "Newest event" is when something last HAPPENED; "Published" is when the
    // pusher last ran. A quiet league and a dead pusher look identical if you
    // only show one of them.
    mini:`${(local).toLocaleString()} events`,
    rows:[["Events logged",String(local)],
          ["Newest event",newest?ago(newest.replace(" ","T")):"\u2014"],
          ["Published",j.generated_at?ago(j.generated_at):"\u2014"]],
    chips,
    extra:silent.length?`<div class="watch"><b>No events yet:</b> ${
      silent.map(k=>esc(TRK_TAG[k])).join(", ")}</div>`:"",
  };
}

/* ---------------- wikipedia ----------------
   Reads the SAME data/events.json as the trackers card and takes only the
   WIKI slice. No second fetch is worth it for one field, and the browser
   serves the second request from cache anyway.

   The events themselves are pushed to the feed by loadTrackers, not here --
   doing it in both would show every Wikipedia change twice. */
async function loadWiki(src){
  const r=await fetch(raw(src.owner,src.repo,"data/events.json"),{cache:"no-cache"});
  if(!r.ok){
    if(r.status===404){
      state.cards[src.id]={rows:[["Status","never published"],
        ["Fix","run nba_push_github.py on the tracker machine"]],chips:[]};
      return;
    }
    throw new Error("HTTP "+r.status);
  }
  const j=await r.json();
  const f=(j.feeds||{}).WIKI;
  if(!f){
    // Configured but silent is a real state, and worth saying plainly rather
    // than showing a zero that looks like a broken card.
    state.cards[src.id]={mini:"no events yet",
      rows:[["Status","no events yet"],
            ["Watching","infobox team / league / career"]],chips:[]};
    return;
  }
  // Break the events down by kind. A club change is the thing worth seeing;
  // CAREER lines are the supporting detail and NEW is a fresh article.
  const ev=(j.events||[]).filter(e=>e.source==="WIKI");
  const n={CHANGED:0,CAREER:0,NEW:0};
  ev.forEach(e=>{ if(n[e.type]!==undefined)n[e.type]++; });
  const last=ev[0]?esc(ev[0].detail).slice(0,90):"";
  state.cards[src.id]={
    mini:`${f.count.toLocaleString()} changes`,
    rows:[["Infobox changes",String(f.count)],
          ["Newest",f.last?ago(f.last.replace(" ","T")):"\u2014"]],
    chips:[`CHANGED <b>${n.CHANGED}</b>`,`CAREER <b>${n.CAREER}</b>`,
           `NEW <b>${n.NEW}</b>`].filter((_,i)=>[n.CHANGED,n.CAREER,n.NEW][i]>0),
    extra:last?`<div class="watch"><b>Latest:</b> ${last}</div>`:"",
  };
}

/* ---------------- pipeline health (GitHub API) ---------------- */
async function loadHealth(src){
  const h={commit:null,run:null,runOk:null};
  try{
    const c=await (await fetch(`https://api.github.com/repos/${src.owner}/${src.repo}/commits?per_page=1`,{headers:apiHeaders()})).json();
    if(Array.isArray(c)&&c[0])h.commit=c[0].commit.committer.date;
  }catch(e){}
  try{
    const r=await (await fetch(`https://api.github.com/repos/${src.owner}/${src.repo}/actions/runs?per_page=1`,{headers:apiHeaders()})).json();
    if(r.workflow_runs&&r.workflow_runs[0]){
      h.run=r.workflow_runs[0].updated_at;
      h.runOk=r.workflow_runs[0].conclusion;             // success / failure / null(running)
    }
  }catch(e){}
  state.health[src.id]=h;
}

/* ---------------- workflow dispatch ---------------- */
const TOKEN_KEY="hoopsmatic_admin_gh_pat";
const ghToken=()=>localStorage.getItem(TOKEN_KEY)||"";
function setToken(){
  const cur=ghToken();
  const t=prompt("Fine-grained GitHub PAT (Actions: Read+write on the data repos).\nStored ONLY in this browser's localStorage — never committed anywhere.\nLeave empty to clear.",cur?"(keep current — type to replace)":"");
  if(t===null)return;
  if(t===""||t==="(keep current — type to replace)"){ if(t==="")localStorage.removeItem(TOKEN_KEY); }
  else localStorage.setItem(TOKEN_KEY,t.trim());
  renderTokenBtn();
}
function renderTokenBtn(){
  const b=$("tokenBtn");
  b.classList.toggle("has",!!ghToken());
  b.textContent=ghToken()?"token ✓":"token";
}
function apiHeaders(){
  const h={"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  if(ghToken())h["Authorization"]="Bearer "+ghToken();
  return h;
}
async function dispatchSource(src){
  if(!ghToken()){setToken();if(!ghToken())return false;}
  const url=`https://api.github.com/repos/${src.owner}/${src.repo}/actions/workflows/${src.workflowFile}/dispatches`;
  const r=await fetch(url,{method:"POST",headers:apiHeaders(),body:JSON.stringify({ref:"main"})});
  if(r.status===204)return true;
  const msg=r.status===401?"token rejected (401)":r.status===403?"token lacks Actions write (403)":
            r.status===404?"not found (404) — repo/workflow access?":"HTTP "+r.status;
  throw new Error(`${src.label}: ${msg}`);
}
let pendingRefresh=[];
function scheduleRefreshes(){
  pendingRefresh.forEach(clearTimeout);
  pendingRefresh=[30000,90000,180000].map(ms=>setTimeout(()=>{refreshFeeds();refreshHealth()},ms));
}
async function updateAll(){
  const btn=$("updateAll"),msg=$("dispatchMsg");
  btn.disabled=true;msg.textContent="dispatching…";
  const ok=[],fail=[];
  for(const s of SOURCES){
    if(!s.workflowFile)continue;
    try{await dispatchSource(s);ok.push(s.label)}catch(e){fail.push(e.message)}
  }
  msg.textContent=(ok.length?`started: ${ok.join(", ")} — results in ~1–2 min`:"")+(fail.length?` · failed: ${fail.join(" · ")}`:"");
  if(ok.length)scheduleRefreshes();
  btn.disabled=false;
}
window.updateOne=async function(id){
  const src=SOURCES.find(s=>s.id===id),msg=$("dispatchMsg");
  try{
    if(await dispatchSource(src)){msg.textContent=`${src.label} run started — results in ~1–2 min`;scheduleRefreshes();}
  }catch(e){msg.textContent=e.message}
}

/* ---------------- render ---------------- */
/* COLLAPSE
   The cards are reference, not reading -- worth a glance, not half a screen.
   Two levels: a per-card toggle (click its title) and a global Condense that
   lays all four out on one row as name + dot + a single fact.

   Both persist, because a layout preference that resets on every reload is
   worse than not having one. */
const COLL_KEY="hoopsmatic_admin_collapsed";
let collapsed=new Set();
try{collapsed=new Set(JSON.parse(localStorage.getItem(COLL_KEY)||"[]"))}catch(e){}
function saveColl(){try{localStorage.setItem(COLL_KEY,JSON.stringify([...collapsed]))}catch(e){}}

window.toggleCard=function(id){
  // In condensed mode a click expands that ONE card rather than fighting the
  // global setting -- otherwise the toggle appears to do nothing.
  if(document.body.classList.contains("condensed")){
    document.body.classList.remove("condensed");
    localStorage.setItem("hoopsmatic_admin_condensed","0");
    collapsed=new Set(SOURCES.map(x=>x.id)); collapsed.delete(id);
  } else if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  saveColl(); applyColl();
};
window.toggleCondense=function(){
  const on=!document.body.classList.contains("condensed");
  document.body.classList.toggle("condensed",on);
  localStorage.setItem("hoopsmatic_admin_condensed",on?"1":"0");
  const b=$("condenseBtn"); if(b)b.classList.toggle("on",on);
  if(on){collapsed.clear();saveColl();}
  applyColl();
};
function applyColl(){
  document.querySelectorAll("#statusGrid .card").forEach(c=>{
    c.classList.toggle("collapsed",collapsed.has(c.dataset.id));
  });
}

function renderCards(){
  $("statusGrid").innerHTML=SOURCES.map(s=>{
    const card=state.cards[s.id], h=state.health[s.id]||{}, err=state.cards[s.id]===undefined;
    const dot=h.runOk==="success"?'<span class="ok">●</span>'
      : h.runOk==="failure"?'<span class="bad">●</span>'
      : '<span class="unk">●</span>';
    const rows=(card&&card.rows||[["Status",err?"unavailable":"—"]])
      .map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
    const chips=card&&card.chips&&card.chips.length?`<div class="statuschips">${card.chips.map(c=>`<span class="chip">${c}</span>`).join("")}</div>`:"";
    const extra=card&&card.extra?card.extra:"";
    // Last commit is a real freshness signal for every source here: for the
    // trackers it is literally when the pusher last committed. The workflow row
    // only means something where a workflow exists.
    const gh=`<div class="kv"><span>Last commit</span><b>${ago(h.commit)}</b></div>`
      +(s.workflowFile?`<div class="kv"><span>Last workflow</span><b>${h.runOk||"—"} · ${ago(h.run)}</b></div>`:"");
    const links=`<a href="${s.page(s.owner)}" target="_blank">${s.workflowFile?"app":"data"}</a>
         <a href="https://github.com/${s.owner}/${s.repo}" target="_blank">repo</a>
         <a href="https://github.com/${s.owner}/${s.repo}/actions" target="_blank">actions</a>
         ${s.workflowFile?`<a class="runlink" onclick="updateOne('${s.id}')">⟳ update now</a>`:""}`;
    // The loader may know a better name than the registry does -- the
    // milestones card reads its season out of the data.
    const label=(card&&card.label)||s.label;
    // One-line summary for the condensed view. Falls back to the first row,
    // which is always the most important thing that loader chose to show.
    const mini=(card&&card.mini)||(card&&card.rows&&card.rows[0]
      ?`${card.rows[0][0]}: ${card.rows[0][1]}`:(err?"unavailable":"—"));
    return `<div class="card" data-id="${s.id}">
      <h2><span class="ctog" onclick="toggleCard('${s.id}')" title="collapse">${
        esc(label)} ${dot}</span></h2>
      <div class="mini">${esc(mini)}</div>
      <div class="cbody">
        ${rows}
        ${gh}
        ${chips}${extra}
        <div class="links">${links}</div>
      </div>
    </div>`;
  }).join("");
  applyColl();
}
function renderFeed(){
  const evs=state.events.slice().sort((a,b)=>a.ts<b.ts?1:-1).slice(0,120);
  if(!evs.length){$("feed").innerHTML='<div class="empty">No activity loaded — sources may still be empty or unreachable.</div>';return}
  const byDay={};
  evs.forEach(e=>{(byDay[e.day]=byDay[e.day]||[]).push(e)});
  $("feed").innerHTML=Object.keys(byDay).sort().reverse().map(day=>{
    const d=new Date(day+"T12:00:00");
    const lab=d.toLocaleDateString([],{weekday:"short",month:"short",day:"numeric",year:"numeric"});
    return `<div class="dayhd">${lab}</div>`+byDay[day].map(e=>{
      const tag=e.kind==="game"?'<span class="tag game">FINAL</span>':`<span class="tag ${e.kind}">${esc(e.tag)}</span>`;
      const t=e.kind==="game"?"":new Date(e.ts).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
      return `<div class="ev">${tag}<div class="tx">${e.html}</div><div class="tm">${t}</div></div>`;
    }).join("");
  }).join("");
}
function renderTop(ok,total){
  $("topline").textContent=`NBA Data HQ — ${ok}/${total} sources live · refreshed ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit",second:"2-digit"})}`;
  $("buildNote").innerHTML=`build <b>${esc(ADMIN_BUILD)}</b> · sources refresh: feeds 60s · pipeline health 10min · add new projects in the SOURCES registry at the top of this file`;
}

/* ---------------- orchestration ---------------- */
async function refreshFeeds(){
  state.events=[];
  let ok=0;
  for(const s of SOURCES){
    try{await s.loader(s);ok++}
    catch(e){console.warn(s.id,"loader failed:",e);state.cards[s.id]=undefined}
  }
  // AFTER the loaders, not before: the slate annotates each game with that
  // team's Out/Questionable names from state.injByTeam, which only
  // loadInjuries fills. Called first, a cold load rendered every game card
  // with an empty injury block, and it only looked right from the second
  // 60-second refresh onward -- using the PREVIOUS cycle's data.
  loadSlate();
  renderCards();renderFeed();renderTop(ok,SOURCES.length);
  syncEventLog();
}

// Record any feed event we haven't seen before into the persistent log, and
// fire a browser notification for each new one (only while the tab is open).
// On the very first sync after a fresh start we seed 'seen' WITHOUT notifying,
// so opening the dashboard doesn't dump a hundred alerts at once.
function syncEventLog(){
  const fresh=[];
  for(const ev of state.events){
    const id=eid(ev);
    if(seenIds.has(id))continue;
    seenIds.add(id);
    const rec={id, kind:ev.kind, ts:ev.ts||new Date().toISOString(),
               text:(ev.text||ev.html||"").toString(), tag:ev.tag||labelForKind(ev.kind)};
    fresh.push(rec);
  }
  if(fresh.length){
    // newest first into the log
    fresh.sort((a,b)=>a.ts<b.ts?1:-1);
    eventLog=fresh.concat(eventLog).slice(0,500);
    if(!firstSync){
      // notify each new event (cap the burst so a slate doesn't spam 50 popups)
      const toNotify=fresh.slice(0,8);
      for(const r of toNotify) notifyEvent(r);
      if(fresh.length>toNotify.length) notifyOnce("burst-"+Date.now(), (fresh.length-toNotify.length)+" more updates in the log");
      setUnread(unreadCount()+fresh.length);
    }
    saveLog();
    renderLogPanel();
  }
  firstSync=false;
  saveLog();
}
function labelForKind(k){
  return k==="game"?"FINAL":k==="milestone"?"MILESTONE":
         k==="trx"?"TRANSACTION":k==="roster"?"ROSTER":
         k==="doc"?"DOC":k==="sheet"?"SHEET":k==="gleague"?"G LEAGUE":
         k==="wiki"?"WIKIPEDIA":
         k&&k.indexOf("inj")===0?"INJURY":(k||"EVENT").toUpperCase();
}
function stripTags(html){const d=document.createElement("div");d.innerHTML=html;return d.textContent||"";}
function renderLogPanel(){
  const body=$("logBody"); if(!body)return;
  if(!eventLog.length){ body.innerHTML='<div class="log-empty">No events logged yet. They\'ll appear here as games finish, injuries update, and milestones drop.</div>'; return; }
  body.innerHTML=eventLog.slice(0,200).map(r=>{
    const cls=r.kind==="game"?"game":r.kind==="milestone"?"milestone":
              (r.kind&&r.kind.indexOf("inj")===0)?"injury":
              ["trx","roster","doc","sheet","gleague","wiki"].indexOf(r.kind)>=0?r.kind:"";
    const when=new Date(r.ts);
    const w=isNaN(when)?"":when.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    return '<div class="log-item"><span class="lt '+cls+'">'+esc(r.tag||"EVENT")+'</span>'+
           '<div class="lx">'+esc(stripTags(r.text))+'<div class="ld">'+esc(w)+'</div></div></div>';
  }).join("");
}
function openLog(){ $("logPanel").style.display="flex"; renderLogPanel(); setUnread(0); }
function closeLog(){ $("logPanel").style.display="none"; }
function clearLog(){ eventLog=[]; saveLog(); renderLogPanel(); setUnread(0); }
function notifyEvent(r){
  if(!alertsOn())return;
  const body=stripTags(r.text).slice(0,140);
  try{ new Notification("HoopsMatic · "+r.tag, {body, tag:r.id}); }catch(e){}
}
async function refreshHealth(){
  for(const s of SOURCES){
    const prev=(state.health[s.id]||{}).runOk;
    await loadHealth(s);
    const cur=(state.health[s.id]||{}).runOk;
    if(cur==="failure"&&prev!=="failure")notifyOnce("wf-"+s.id+"-"+((state.health[s.id]||{}).run||""),s.label+": workflow FAILED");
  }
  renderCards();
}
(async function init(){
  loadLog();
  renderTokenBtn();renderBell();
  $("updateAll").addEventListener("click",updateAll);
  $("tokenBtn").addEventListener("click",setToken);
  $("bellBtn").addEventListener("click",toggleAlerts);
  $("logBtn").addEventListener("click",openLog);
  $("condenseBtn").addEventListener("click",toggleCondense);
  // A layout preference that forgets itself on reload is worse than none.
  if(localStorage.getItem("hoopsmatic_admin_condensed")==="1"){
    document.body.classList.add("condensed");
    $("condenseBtn").classList.add("on");
  }
  $("logClose").addEventListener("click",closeLog);
  $("logMarkRead").addEventListener("click",()=>setUnread(0));
  $("logClear").addEventListener("click",clearLog);
  await Promise.all([refreshFeeds(),refreshHealth()]);
  setInterval(refreshFeeds,60000);
  setInterval(refreshHealth,600000);
})();
</script>
